[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcadvent-exitcode"
version = "0.1.0"
description = "通过字符级与结构级特征识别命令行工具的退出码语义的痕迹，给出密度与命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "mcadvent" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://mcadvent.github.io"
Repository = "https://github.com/mcadvent/exitcode"
Issues = "https://github.com/mcadvent/exitcode/issues"

[project.scripts]
exitcode = "exitcode:main"

[tool.setuptools]
py-modules = ["exitcode"]
